    central_engine:
      want: Mara and the witness coalition want a public reckoning over the coast's
        vanished communities.
      resistance: Factions depend on the old map for food routes, property, and legal
        identity.
      conflict: Repairing the map threatens the fragile peace it enabled.
      stakes: Recognition may trigger civil violence or leave the erased communities
        permanently stateless.
      change: Mara must learn whether testimony can govern without becoming another
        coercive map.
    architecture_preferences: null
    hard_constraints: []
    not_this:
    - A chapter outline
    - a scene outline
    - or a pre-solved Book 3
    open_questions:
    - Who can share authority when the Admiralty, House of Names, Ferrymen's Union,
      and marsh communities claim incompatible rights?
    - Can Nera's testimony be heard without exposing the person she protects?
