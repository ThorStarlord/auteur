direction:
  book_number: 3
  identity:
    title: The Common Horizon
    core_answer: A plural map can become accountable civic practice only when its
      disagreements remain visible and its witnesses remain protected.
    target_experience:
      primary: catharsis
      progression: exposure -> sacrifice -> provisional trust
      secondary: []
      avoid:
      - total closure
      primary_emotional_promise: catharsis
      secondary_palette: []
      avoided_experiences:
      - total closure
      emotional_trajectory: null
      genre_emotion_stack: null
      pov_experience_contracts: null
    story_type:
      medium: novel
      mode: procedural
      genre: mystery
      subgenres: []
      target_audience: adult
      length_class: null
    central_engine:
      want: Mara, Ion, and the witness coalition want a governing map that can hold
        erased-coast testimony without restoring a single sanctioned history.
      resistance: The republic's food routes, legal identities, and institutions still
        depend on the old map and its authority.
      conflict: Publicly testing the reef signal and witness evidence risks exposing
        protected people and fracturing the fragile civic settlement.
      stakes: The republic may either preserve contested communities through shared
        authority or return to central control that makes their histories legally
        disappear.
      change: Mara must turn accountable testimony into a durable but visibly contested
        civic practice, while Ion accepts shared authority over command certainty.
    architecture_preferences: null
    hard_constraints:
    - No chapter outline
    - No scene outline
    - Preserve visible disagreement
    - Protect the endangered witness until their account can be heard
    not_this:
    - A tidy total closure
    - A restored single official map
    open_questions:
    - Can Mara and Ion make their costly mutual reliance publicly accountable without
      turning it into a new hierarchy?
    - Can Nera's public claim and the reef-signal evidence be tested without exposing
      the protected person?
    - What authority should Brann and Lio's evidence custody have in the common map?
    confidence: 0.9
    alternatives: []
    recommendation_mode: opinionated
    best_basis: structurally_coherent
    why_this_is_best: It resolves the trilogy's map and authority pressure through
      provisional shared governance while carrying the relationship path, witness
      obligation, and delayed reef evidence into Book 3.
    rejected_directions: []
    author_overrides: []
    characters: []
    genre_contract_snapshot:
      genre_id: mystery
      display_name: Mystery
      core_truth: The truth exists, can be discovered through logic, and has a cost.
      audience_product: Intellectual satisfaction, epistemic certainty, revelation.
      primary_excitement_beats:
      - the crime or puzzle presented
      - red herring or false lead
      - key clue discovered
      - the detective endangered or high stakes
      - the final revelation or confrontation
      required_tropes:
      - clue logic
      - clever deduction
      - suspect pool
      optional_tropes:
      - noir detective
      - locked room puzzle
      - unreliable witness
      forbidden_mismatches:
      - no logical explanation
      - unsolvable puzzle
      - the real mystery is forgiving oneself
      - random culprit introduced at the last minute without clues
      common_failure_modes:
      - The detective spends more time in therapy than investigating clues
      - The puzzle is resolved by a magic coincidence rather than deduction
      psychology_budget:
        level: functional
        reason: Mystery runs on clue logic, deduction, and final revelation. The detective
          needs motivation clarity and sharp texture, but too much therapeutic wound
          weakens the puzzle.
        motivation_clarity: required
        psychological_depth: optional
        character_texture: encouraged
      scope_profile:
        natural_lengths:
        - short_story
        - novella
        - novel
        minimum_viable_length: short_story
        default_length: novel
        narrative_runway: medium
        recommended_complexity: standard
        mechanical_load: medium
        worldbuilding_load: low
        cast_load: medium
        compression_strategies:
        - Use a compact suspect pool.
        - Limit clue logic to one central chain.
        - Avoid parallel timelines unless length expands.
        expansion_strategies:
        - Add suspects, red herrings, procedural detail, or institutional coverup
          only with more runway.
        scope_failure_modes:
        - Too many suspects for the chosen length.
        - Layered clue logic has no room for fair setup and payoff.
      setup_contract:
        emotional_runway: medium
        relationship_establishment: optional
        baseline_world_establishment: required
        minimum_setup_beats:
        - Establish the detective's context or state of the world
        - Introduce the victim or situation before the crime is discovered (or right
          at the crime scene)
        - Establish the legitimacy of the investigation
        forbidden_shortcuts:
        - Stating the crime's significance without showing why the community/victim
          mattered
        compression_strategies:
        - Begin immediately at the crime scene and backfill the victim's ordinary
          bond via physical clues
      default_engine_biases:
      - Deductive logic and plot progression are primary; interiority serves clue
        logic
      recommended_subversions:
      - The detective solves the mystery perfectly but the social/legal outcome is
        compromised
