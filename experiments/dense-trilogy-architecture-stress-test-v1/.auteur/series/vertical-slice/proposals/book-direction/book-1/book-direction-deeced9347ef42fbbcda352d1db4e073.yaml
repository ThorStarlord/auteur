      want: Mara wants to certify a new safe channel through the salt marsh.
      resistance: The Admiralty's official charts erase settlements that complicate
        its borders.
      conflict: Mara must decide whether accurate surveying can be separated from
        the people the chart will displace.
      stakes: A false chart will drown a winter convoy and expose the marsh settlements
        to seizure.
