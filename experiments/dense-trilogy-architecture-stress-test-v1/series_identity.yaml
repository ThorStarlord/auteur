title: The Cartographers of Salt
series_type: trilogy
core_question: Can a society share a future when its map is built from deliberate forgetting?
target_experience:
  primary: haunted discovery
  progression: belonging -> fracture -> hard-won interdependence
  avoid:
    - effortless revelation
global_arc:
  beginning: The Tidebound Republic survives by redrawing its drowned past.
  midpoint: The old coast returns and makes every institution contest its own legitimacy.
  ending: The republic learns to govern with a contested memory rather than a single official map.
book_plans:
  - book_number: 1
    title: The Sounding Line
    series_function: question
    core_answer: A mapmaker must choose living testimony over the state map that made her career.
    target_experience:
      primary: suspicion
      progression: wonder -> unease -> irreversible doubt
      avoid: [clean certainty]
    story_type: {medium: novel, mode: procedural, genre: mystery, target_audience: adult}
    central_engine:
      want: Mara wants to certify a new safe channel through the salt marsh.
      resistance: The Admiralty's official charts erase settlements that complicate its borders.
      conflict: Mara must decide whether accurate surveying can be separated from the people the chart will displace.
      stakes: A false chart will drown a winter convoy and expose the marsh settlements to seizure.
      change: Mara changes from trusted instrument of the Admiralty into a mapmaker answerable to witnesses.
    series_threads_carried: [mara_arc, erased-coast, republic-legitimacy]
    required_setups: [brass-compass, nera-oath, bell-reef]
    required_payoffs: []
    scope: city
    climax_intensity: 7
  - book_number: 2
    title: The Returning Coast
    series_function: complication
    core_answer: "Directional scaffolding only: the returning coast turns testimony into a struggle over citizenship and repair."
    target_experience:
      primary: pressure
      progression: mobilization -> divided loyalty -> costly redefinition
      avoid: [predetermined betrayals]
    story_type: {medium: novel, mode: procedural, genre: mystery, target_audience: adult}
    central_engine:
      want: The group wants a public reckoning over the coast's vanished communities.
      resistance: Factions depend on the old map for food routes, property, and legal identity.
      conflict: Repairing the map threatens the fragile peace it enabled.
      stakes: Recognition may trigger civil violence or leave the erased communities permanently stateless.
      change: Directional only; the series must discover who can share authority after the Book 1 rupture.
    series_threads_carried: [mara_arc, erased-coast, nera-oath, republic-legitimacy]
    required_setups: []
    required_payoffs: []
    scope: national
    climax_intensity: 8
  - book_number: 3
    title: The Common Horizon
    series_function: resolution
    core_answer: "Directional scaffolding only: a plural map must survive the return of the power that authored the forgetting."
    target_experience:
      primary: catharsis
      progression: exposure -> sacrifice -> provisional trust
      avoid: [total closure]
    story_type: {medium: novel, mode: procedural, genre: mystery, target_audience: adult}
    central_engine:
      want: "Directional only: establish a governing map whose disagreements remain visible."
      resistance: "Directional only: the republic's survival systems were designed around one sanctioned history."
      conflict: "Directional only: shared authority may be slower and more dangerous than restored central control."
      stakes: "Directional only: the coast's future depends on whether memory can become a public practice."
      change: Directional only; no detailed realization is pre-authored.
    series_threads_carried: [mara_arc, erased-coast, republic-legitimacy]
    required_setups: []
    required_payoffs: [bell-reef]
    scope: civilizational
    climax_intensity: 9
