identity:
  title: The First Recovered Tape
  core_answer: Telling the truth requires protecting the people erased by the official record.
  target_experience:
    primary: suspicion
    progression: curiosity -> distrust -> costly clarity
    avoid:
      - effortless certainty
  story_type:
    medium: novel
    mode: procedural
    genre: mystery
    target_audience: adult
  central_engine:
    want: Recover a tape that proves the city falsified an early archive record.
    resistance: The archive's custodians erase witnesses and replace records faster than they can be verified.
    conflict: The investigator must authenticate the tape while deciding which witnesses can survive public exposure.
    stakes: Publishing too soon will destroy the witnesses; waiting will let the custodians erase the truth.
    change: The investigator learns that preserving truth requires responsibility for the people bound to it.
  not_this:
    - A complete account of every future Episode.
  open_questions:
    - Which witness can safely authenticate the tape?
  confidence: 0.82
  alternatives: []
  why_this_is_best: It tests the Series promise through one bounded Episode 1 conflict.
  rejected_directions: []
  author_overrides: []
