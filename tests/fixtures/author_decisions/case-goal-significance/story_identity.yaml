title: Salt of the Earth
core_answer: "A family's inheritance is not the land but the permission to choose differently than it did."
target_experience:
  primary: gravity
  progression: "tension -> reckoning -> quiet uncertainty"
  secondary: []
  avoid:
    - "a tidy reconciliation"
    - "a fully resolved ending"
  primary_emotional_promise: gravity
  secondary_palette: []
  avoided_experiences:
    - "a tidy reconciliation"
    - "a fully resolved ending"
  emotional_trajectory: null
  genre_emotion_stack: null
  pov_experience_contracts: null
story_type:
  medium: novel
  mode: intimate
  genre: literary
  subgenres:
    - "working-class drama"
    - "family drama"
  target_audience: adult
  length_class: null
central_engine:
  want: "Signe wants the family to decide the land's fate without the decision destroying what remains of the family."
  resistance: "Anders' debts, Marta's hopes for the saltworks, their father's unreadable silence, and the fact that every option costs someone the life they imagined."
  conflict: "The land can be sold, kept, or left to die - but the family cannot agree, and each sibling's private stake (debt, pregnancy, marriage) makes every argument also a betrayal."
  stakes: "The family's future, the land's fate, and each sibling's private life - the decision will be made with or without agreement, and the cost lands unevenly."
  change: "Signe changes from believing the family's fate is a problem with three options - sell, keep, die - into someone who can hold the family's real legacy, which turns out not to be the land at all."
not_this:
  - "a redemption arc for Halvor"
  - "violence"
  - "a tidy reconciliation of the family"
  - "a fully resolved ending (the land's fate decided and closed)"
open_questions:
  - "Which subplot must be cut so the ending can stay ambiguous? (Anders' debt, Marta's pregnancy, Signe's marriage - the story has budget for two)"
confidence: null
alternatives: []
recommendation_mode: opinionated
best_basis: genre_aligned
why_this_is_best: "Seeded offline identity skeleton. Edit these fields to define your accepted commitments."
rejected_directions:
  - "A redemption or clarity arc for Halvor would violate the constraint that the father does not transform, apologize, or achieve clarity."
  - "A warm family reconciliation ending would contradict the constraints that the ending remains ambiguous and the family does not unite tidily."
