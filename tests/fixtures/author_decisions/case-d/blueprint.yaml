  custom_rules:
  - a character who authoritatively explains the room's rules
  - escape through violence
  - a revealed mechanism resolving the room (deus ex)
  - an accidental single protagonist with structurally dominant weight
  - A revealed mechanism (a test, a god, a warden) that explains and resolves the
    room would violate the constraint that the room is not resolved by explanation.
  - A violent escape or struggle for the exit would break the premise that leaving
    requires each occupant's own decision.
