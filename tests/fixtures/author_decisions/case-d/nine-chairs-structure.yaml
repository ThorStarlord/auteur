decision_id: nine-chairs-structure
unresolved_choice:
  choice_id: nine-chairs-structure
  question: "Can nine parallel arcs cohere, or does the story need one character's arc as the through-line?"
  options:
    - "Nine comparable parallel arcs (rotating POV)"
    - "One character's arc as structural through-line"
alternative_ids:
  - nine_parallel_arcs
  - one_structural_spine
combination:
  rule: one_of
criterion:
  text: "Which structure best serves the theme: coherence of nine arcs vs clarity of a spine"
  evaluator: author_or_consumer
hard_constraints:
  - ref: not_this[0]
    snapshot: "a character who authoritatively explains the room's rules"
  - ref: not_this[1]
    snapshot: "escape through violence"
  - ref: not_this[2]
    snapshot: "a revealed mechanism resolving the room (deus ex)"
  - ref: not_this[3]
    snapshot: "an accidental single protagonist with structurally dominant weight"
  - ref: rejected_directions[0]
    snapshot: "A revealed mechanism (a test, a god, a warden) that explains and resolves the room would violate the constraint that the room is not resolved by explanation."
  - ref: rejected_directions[1]
    snapshot: "A violent escape or struggle for the exit would break the premise that leaving requires each occupant's own decision."
  - ref: target_experience.avoid[0]
    snapshot: "an explained resolution (deus ex)"
  - ref: target_experience.avoid[1]
    snapshot: "violent escape"
required_characters:
  - name: Ansel
