title: The Nine Chairs
core_answer: "Holding the life not lived is the price of choosing the life that was."
target_experience:
  primary: wonder
  progression: "disorientation -> confrontation -> acceptance"
  secondary: []
  avoid:
    - "an explained resolution (deus ex)"
    - "violent escape"
  primary_emotional_promise: wonder
