  target_audience: adult
  length_class: null
central_engine:
  want: "Each occupant wants to leave the room - and to know which life, lived or un-lived, is truly theirs."
  resistance: "The chairs show each occupant a life they never lived, and the room gives no rules, no exit, and no authority to explain it; each must hold both lives without surrendering either."
  conflict: "Leaving requires each occupant to decide which life is theirs, but the room only opens through a collective agreement on who goes first - and the counter-lives are seductive precisely because they are painless."
  stakes: "For each occupant: the difference between the life they lived and the life they could have lived - and whether the room is a prison or a threshold depends on what they choose."
  change: "Each occupant changes from defending their lived life as the only true one, into someone who can hold the un-lived life without surrendering the lived one; collectively, the room changes from a prison into a threshold."
not_this:
  - "a character who authoritatively explains the room's rules"
  - "escape through violence"
  - "a revealed mechanism resolving the room (deus ex)"
  - "an accidental single protagonist with structurally dominant weight"
open_questions:
  - "Does the rotating-POV structure support or fragment the theme - can nine parallel arcs cohere, or does the story need a structural spine (one character's arc as the through-line)?"
confidence: null
alternatives: []
recommendation_mode: opinionated
best_basis: genre_aligned
why_this_is_best: "Seeded offline identity skeleton. Edit these fields to define your accepted commitments."
rejected_directions:
  - "A revealed mechanism (a test, a god, a warden) that explains and resolves the room would violate the constraint that the room is not resolved by explanation."
  - "A violent escape or struggle for the exit would break the premise that leaving requires each occupant's own decision."
