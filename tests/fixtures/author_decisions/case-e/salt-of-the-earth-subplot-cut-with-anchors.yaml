decision_id: salt-of-the-earth-subplot-cut
unresolved_choice:
  choice_id: salt-of-the-earth-subplot-cut
  question: "Which subplot must be cut so the ending can stay ambiguous?"
  options:
    - "Anders' debt"
    - "Marta's pregnancy"
    - "Signe's marriage"
alternative_ids:
  - anders_debt
  - marta_pregnancy
  - signe_marriage
combination:
  rule: choose_k_of_n
  k: 2
criterion:
  text: "Which cut best preserves the ambiguous/unresolved ending"
  evaluator: author_or_consumer
hard_constraints:
  - ref: not_this[0]
    snapshot: "a redemption arc for Halvor"
  - ref: not_this[1]
    snapshot: "violence"
  - ref: not_this[2]
    snapshot: "a tidy reconciliation of the family"
  - ref: not_this[3]
    snapshot: "a fully resolved ending (the land's fate decided and closed)"
  - ref: rejected_directions[0]
    snapshot: "A redemption or clarity arc for Halvor would violate the constraint that the father does not transform, apologize, or achieve clarity."
  - ref: rejected_directions[1]
    snapshot: "A warm family reconciliation ending would contradict the constraints that the ending remains ambiguous and the family does not unite tidily."
  - ref: target_experience.avoid[0]
    snapshot: "a tidy reconciliation"
  - ref: target_experience.avoid[1]
    snapshot: "a fully resolved ending"
