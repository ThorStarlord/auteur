  central_engine:
    want: Protect the archive after the council retracts its admission.
    resistance: The retraction makes the archive's evidence vulnerable to seizure.
    conflict: The investigator must secure the evidence without silencing its witnesses.
    stakes: Losing the archive will sever the only chain that can authenticate the testimony.
    change: The investigator learns that evidence needs durable protection as well as public exposure.
  not_this:
