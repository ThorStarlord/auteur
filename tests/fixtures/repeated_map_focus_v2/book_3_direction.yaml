book_number: 3
identity:
  title: The Protected Archive
  core_answer: Public memory survives when its evidentiary chain remains protected.
  target_experience:
    primary: suspicion
    progression: retreat -> protection -> renewed inquiry
    avoid:
      - effortless certainty
  story_type:
    medium: novel
    mode: procedural
    genre: mystery
