  - book_number: 3
    direction:
      book_number: 3
      identity:
        title: The Protected Archive
        core_answer: Public memory survives when its evidentiary chain remains protected.
        target_experience:
          primary: suspicion
          progression: retreat -> protection -> renewed inquiry
          avoid:
            - effortless certainty
        story_type:
          medium: novel
          mode: procedural
          genre: mystery
          target_audience: adult
        central_engine:
          want: Protect the archive after the council retracts its admission.
          resistance: The retraction makes the archive's evidence vulnerable to seizure.
          conflict: The investigator must secure the evidence without silencing its witnesses.
          stakes: Losing the archive will sever the only chain that can authenticate the testimony.
          change: The investigator learns that evidence needs durable protection as well as public exposure.
        not_this:
          - A final resolution of every Series pressure.
        open_questions:
          - How can the protected evidence restore witness authority?
        confidence: 0.82
        alternatives: []
        why_this_is_best: It responds to the accepted retraction through a concrete protection constraint.
        rejected_directions: []
        author_overrides: []
      series_commitment_ids:
        - contested-history
