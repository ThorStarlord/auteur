# Vendored Sensemaking Skills - curated subset contract
#
# Auteur intentionally vendors a curated, pinned subset of the Sensemaking
# Skills framework (owner decision 2026-08-14). This manifest makes that
# relationship explicit and governable. It is machine-read by
# scripts/verify-vendored-contract.py (drift detection wired into
# scripts/check.py). This snapshot is NOT a complete current Sensemaking
# installation.
schema_version: 1
contract_name: vendored-sensemaking-subset
status: intentional_curated_subset

source:
  repository: sensemaking-skills (upstream framework)
  # UNRECORDED: no single upstream revision reconstructs the full snapshot.
  # Bounded git/content investigation (2026-08-15) classified the snapshot
  # as MIXED_OR_LOCALLY_MODIFIED: skills/repo-sensemaker/SKILL.md is
  # content-identical (modulo BOM) to upstream commit 95b2962 (2026-05-19,
  # pre workflow-orchestrator->workflow-planner rename), while
  # scripts/validate-repo.py and
  # skills/workflow-orchestrator/references/workflow-registry.yaml differ
  # from every upstream revision in the pre-rename era. No source SHA is
  # invented. The next intentional update MUST record the upstream SHA here.
  revision: UNRECORDED
  revision_note: "Historical snapshot predating the workflow-planner rename and the probe engine; no upstream SHA was recorded at vendoring time. The next intentional update MUST record the upstream SHA here."
  provenance_status: unrecoverable_for_pinning
  provenance_investigation: "2026-08-15 bounded git/content comparison against the upstream sensemaking-skills history (window 2026-05-13..2026-05-22): repo-sensemaker/SKILL.md content-identical (modulo BOM) to 95b2962 (2026-05-19); validate-repo.py and the workflow-orchestrator registry differ from every era revision (registry is an auto-invocation-era variant; validate-repo.py differs ~72 lines). Classification: MIXED_OR_LOCALLY_MODIFIED_SNAPSHOT."
  best_supported_range: "pre-rename workflow-orchestrator era, 2026-05-13 .. 2026-05-19; repo-sensemaker SKILL.md exactly matches 95b2962 (2026-05-19); other vendored files are locally-modified/mixed pre-rename variants"
  historical_exception: "Owner decision 2026-08-15: historical snapshots may truthfully retain UNRECORDED provenance when a single exact source revision cannot be reconstructed; the first intentional update after adoption of this contract establishes the first authoritative pinned baseline."
  recorded_at: "2026-08-14"

intent:
  statement: "Auteur intentionally vendors a curated, pinned subset of Sensemaking Skills (owner decision 2026-08-14)."
  is_not: "a complete current Sensemaking installation"

included:
  skills:
    - repo-sensemaker
    - problem-framer
    - unknowns-mapper
    - prompt-handoff
    - setup-sensemaking-skills
    - sensemaking-docs-reconciler
    - skill-maintainer
    - usage-researcher
    - workflow-orchestrator
    - docs-aligner
    - to-issues
    - to-prd
    - triage
    - project-classifier
    - data-access-layer-auditor
    - tdd
  scripts:
    - analyze-run-failures.py
    - orchestration-runner.py
    - package_skill.py
    - router.py
    - skill-execution-agent.py
    - skill_execution_dispatcher.py
    - test-validators.py
    - validate-artifact.py
    - validate-brief.py
    - validate-mode-coverage.py
    - validate-output.py
    - validate-plan.py
    - validate-project-classification.py
    - validate-prompt-handoff.py
    - validate-repo.py
    - validate-run-log.py
    - validate-skill-improvement-plan.py
    - validate-unknowns-map.py
    - validate-usage-research-report.py
    - validate-user-intent-amendment.py
    - validate-user-intent.py
    - validate-workflow-design.py
    - workflow-execution-engine.py
    - _validator_utils.py
  framework_docs:
