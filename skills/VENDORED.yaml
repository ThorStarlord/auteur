    - docs/mode-coverage.yaml

# Current-era Sensemaking components NOT part of this snapshot. If one of
# these appears, the drift check fails: adding current-era machinery is an
# intentional contract change and must be recorded here first.
excluded:
  - skills/workflow-planner
  - scripts/probe-repo.py
  - scripts/repo_probes.py
  - scripts/validate-probe-report.py
  - scripts/brief_skeleton.py

known_characteristics:
  - "The vendored validate-repo.py reports non-critical warnings: recursive workflow-orchestrator steps in fast-path-workflow and full-fog-workflow; unregistered artifacts ui_flows and screen_specs in ui-implementation-workflow. These are characteristics of the frozen snapshot and the gate treats them as warnings (non-blocking)."

update_policy:
  - "Manual and gated: any intentional update of the vendored subset must record the upstream SHA in source.revision and adjust included/excluded lists."
  - "The first intentional update after adoption of this contract establishes the first canonical pinned baseline (historical exception)."
  - "scripts/sync_interface_skills.py covers a DIFFERENT source (interface-skills -> .agents/skills) and is NOT the update mechanism for this subset."

validation_expectations:
  - "scripts/check.py validates this curated subset as a pinned snapshot, not as a complete current Sensemaking installation."
  - "scripts/verify-vendored-contract.py enforces the included/excluded lists (drift detection)."
