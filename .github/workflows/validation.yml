name: Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  focused-validation:
    name: "L1 focused validation (Python 3.12)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Select focused tests and Ruff paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          focused=()
          ruff_paths=()
          for path in "${changed[@]}"; do
            if [[ "$path" == tests/*.py && -f "$path" ]]; then
              focused+=("$path")
            fi
            if [[ ("$path" == src/*.py || "$path" == tests/*.py) && -f "$path" ]]; then
              ruff_paths+=("$path")
            fi
          done
          if ((${#focused[@]} == 0)); then
            focused=(tests/test_cli_smoke.py tests/test_engine_v1_smoke.py)
          fi
          printf 'FOCUSED_TESTS=%s\n' "${focused[*]}" >> "$GITHUB_ENV"
          printf 'RUFF_PATHS=%s\n' "${ruff_paths[*]}" >> "$GITHUB_ENV"

      - name: Run L1 focused validation
        run: python -m pytest -q $FOCUSED_TESTS --tb=short

      - name: Run focused verification stack
        run: python scripts/check.py --skip-pytest --ruff-paths $RUFF_PATHS
