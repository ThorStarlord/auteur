name: Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: "test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Select validation scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          full_suite=false
          for path in "${changed[@]}"; do
            case "$path" in
              .github/*|factory/*|MISSION.md|FACTORY_RULES.md|AGENTS.md|CLAUDE.md|docs/adr/*|docs/engineering/release-qualification.md|pyproject.toml|uv.lock|scripts/check.py|*/models.py|*/serializers.py|*/cli.py|*/cli_*.py|*/data/*)
                full_suite=true
                ;;
            esac
          done

          focused=()
          for path in "${changed[@]}"; do
            if [[ "$path" == tests/*.py && -f "$path" ]]; then
              focused+=("$path")
            fi
          done
          if ((${#focused[@]} == 0)); then
            focused=(tests/test_cli_smoke.py tests/test_engine_v1_smoke.py)
          fi

          echo "VALIDATION_MODE=$([[ "$full_suite" == true ]] && echo full || echo focused)"
          echo "FULL_SUITE=$full_suite" >> "$GITHUB_ENV"
          printf 'FOCUSED_TESTS=%s\n' "${focused[*]}" >> "$GITHUB_ENV"

      - name: Run full test suite
        if: env.FULL_SUITE == 'true'
        run: python -m pytest -q --tb=short

      - name: Run focused test suite
        if: env.FULL_SUITE != 'true'
        run: python -m pytest -q $FOCUSED_TESTS --tb=short

      - name: Run verification stack (validators, repo checks, ruff)
        run: python scripts/check.py --skip-pytest

  wheel-smoke:
    name: "wheel smoke test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build wheel
        run: python -m build

      - name: Create test environment
        run: python -m venv /tmp/wheel-test

      - name: Install wheel
        run: /tmp/wheel-test/bin/python -m pip install dist/*.whl

      - name: Test installed wheel (help)
        run: /tmp/wheel-test/bin/auteur --help

      - name: Test installed wheel (ontology list)
        run: /tmp/wheel-test/bin/auteur ontology list
