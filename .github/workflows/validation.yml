name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: "test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q --tb=short

      - name: Run verification stack (validators, repo checks, ruff)
        run: python scripts/check.py --skip-pytest

  wheel-smoke:
    name: "wheel smoke test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install build

      - name: Build wheel
        run: python -m build

      - name: Create test environment
        run: python -m venv /tmp/wheel-test

      - name: Install wheel
        run: /tmp/wheel-test/bin/python -m pip install dist/*.whl

      - name: Test installed wheel (help)
        run: /tmp/wheel-test/bin/auteur --help

      - name: Test installed import path
        run: /tmp/wheel-test/bin/python -c "import auteur, pathlib; path = pathlib.Path(auteur.__file__).resolve(); assert 'site-packages' in str(path), path; print(path)"

      - name: Test installed wheel (ontology list)
        run: /tmp/wheel-test/bin/auteur ontology list

      - name: Test installed wheel (golden-path command help)
        run: |
          /tmp/wheel-test/bin/auteur workflow next --help
          /tmp/wheel-test/bin/auteur reasoning book --help

  release-qualification:
    name: "exact-SHA release qualification"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: python -m pip install -e ".[dev]" build

      - name: Produce exact-SHA qualification evidence
        run: python scripts/release_evidence.py

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-evidence
          path: docs/qualification-evidence/*.json
