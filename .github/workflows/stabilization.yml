name: Stabilization

on:
  workflow_dispatch:

jobs:
  full-regression:
    name: "L3 full regression (Python 3.12)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run L3 full regression suite
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pytest -q --tb=short --durations=25 --junitxml=artifacts/stabilization-junit.xml

      - name: Upload L3 test accounting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-junit-${{ github.sha }}
          path: artifacts/stabilization-junit.xml
          if-no-files-found: warn

      - name: Run verification stack
        run: python scripts/check.py --skip-pytest
