pack_id: investigation
pack_kind: structure
version: 0.1.0
schema_version: 1
display_name: Investigation
description: A structure pack for stories driven by questions, evidence, and changing hypotheses.
applicability:
  signals: [investigation, mystery, detective, evidence, clue]
  description: Applies when the protagonist must resolve an explicit question through discoveries.
design_options:
  - option_id: escalating_evidence
    name: Escalating evidence
    what_it_is: Each discovery changes the cost or meaning of the investigation.
    craft_function: Converts information gathering into pressure and irreversible choices.
    works_well_when: The mystery should alter relationships or stakes as it unfolds.
    tradeoffs: [Requires careful control of reader and character knowledge.]
    common_beginner_failure: Adding clues without changing the question or pressure.
    compatible_patterns: [secrets, institutional obstruction]
    tensions: [fairness versus surprise]
    questions: ["How does this clue change the next decision?"]
    architecture_targets: [Structure, Knowledge, Causality]
    strength: STRONG_DEFAULT
teaching_notes:
  - note_id: clue_pressure
    concept: Evidence should change decisions
    explanation: A clue matters when it changes what a character can or must do next.
    question: What new action does this evidence make possible or necessary?
compatibility_rules: []
decision_hooks:
  - hook_id: investigation_pressure
    decision: investigation pressure
    question: "What does the next discovery make more costly?"
    recommended_option_id: escalating_evidence
