<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auteur Beginner Workspace</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <button id="nav-toggle" type="button" aria-controls="story-navigator" aria-expanded="false" aria-label="Toggle Story Navigator">
      &#9776;
    </button>
    <div class="app-title">
      <h1>Beginner Workspace</h1>
      <p id="workspace-meta" aria-live="polite"></p>
    </div>
    <form id="workspace-form" class="workspace-form" aria-label="Open workspace">
      <label>
        Workspace ID
        <input id="workspace-id" name="workspace" type="text" autocomplete="off" placeholder="workspace-1" />
      </label>
      <button type="submit">Open</button>
    </form>
  </header>

  <div class="app-shell">
    <aside id="story-navigator" aria-label="Story Navigator" class="navigator">
      <h2>Story Navigator</h2>
      <ol id="navigator-list" class="navigator-list"></ol>
      <section aria-label="Story Map" class="story-map">
        <h3>Story Map</h3>
        <p class="hint">Read-only overview. It never edits your story.</p>
        <div id="story-map-body" aria-readonly="true"></div>
      </section>
    </aside>

    <main class="workspace-main">
      <p id="status-line" role="status" aria-live="polite" class="status-line"></p>

      <section data-testid="decision-card" id="decision-card" class="decision-card" aria-label="Decision card">
        <h2 id="card-question">Loading decision card&hellip;</h2>
        <div id="card-options" class="card-options"></div>
        <p id="save-feedback" class="save-feedback" aria-live="polite"></p>
        <div id="card-warnings" class="card-warnings"></div>
        <div id="card-tutor" class="card-tutor"></div>
        <button data-testid="continue" id="continue-button" type="button" class="continue-button">
          Continue
        </button>
      </section>

      <section aria-label="Review" class="review-panel">
        <h2>Milestone review</h2>
        <div id="review-body"></div>
      </section>
    </main>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
