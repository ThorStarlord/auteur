# Netorare Genre Ontology Extensions
# Genre-specific semantic concepts for netorare narratives.
# Craft/interpretive rules are advisory and never hard ontology validity.

extends: base

concepts:
  CuckoldryArc:
    name: CuckoldryArc
    definition: A narrative arc progression specific to netorare that tracks an emotional and psychological journey through relationship change, revelation, humiliation, and acceptance or resolution.
    category: genre-specific
    parent_concepts:
      - Arc
    relationships:
      - source_concept: CuckoldryArc
        target_concept: Character
        cardinality: many-to-many
        description: Cuckoldry arc involves characters participating in the relationship dynamic
        required: true
      - source_concept: CuckoldryArc
        target_concept: Setup
        cardinality: one-to-one
        description: Cuckoldry arc may use setup to initiate or prepare a reveal
        required: false
    validation_rules:
      - rule_id: cuckoldry_arc_has_stages
        kind: craft_heuristic
        condition: The arc commonly benefits from identifiable emotional or relational stages.
        error_message: Cuckoldry arc may lack legible stage progression.
        applies_to: [netorare]
      - rule_id: cuckoldry_arc_tracks_emotional_journey
        kind: interpretive_criterion
        condition: Whether stages show meaningful emotional change requires story-context judgment.
        error_message: Cuckoldry arc stages may not show meaningful emotional progression.
        applies_to: [netorare]

  HumiliationProgression:
    name: HumiliationProgression
    definition: The escalation or modulation of humiliation elements within a netorare narrative, tracking intensity, frequency, and established boundaries.
    category: genre-specific
    parent_concepts:
      - Conflict
    relationships:
      - source_concept: HumiliationProgression
        target_concept: Arc
        cardinality: many-to-many
        description: Humiliation progression may occur within arcs
        required: false
      - source_concept: HumiliationProgression
        target_concept: Setup
        cardinality: one-to-many
        description: Setups may contribute to humiliation progression moments
        required: false
    validation_rules:
      - rule_id: humiliation_respects_consent
        kind: interpretive_criterion
        condition: Boundary and consent consistency must be judged against accepted story context.
        error_message: Humiliation may conflict with the established consent framework.
        applies_to: [netorare]
      - rule_id: humiliation_has_emotional_impact
        kind: interpretive_criterion
        condition: Emotional consequence is an audience- and character-context judgment.
        error_message: Humiliation element may have insufficient emotional consequence for the intended design.
        applies_to: [netorare]

  ConsentBoundary:
    name: ConsentBoundary
    definition: A defined limit or agreement about what kinds of interactions or relationship behavior are permitted between characters within the narrative.
    category: genre-specific
    parent_concepts: []
    relationships:
      - source_concept: ConsentBoundary
        target_concept: Character
        cardinality: many-to-many
        description: Consent boundary applies to participating characters
        required: true
      - source_concept: ConsentBoundary
        target_concept: Relationship
        cardinality: many-to-many
        description: Consent boundary governs relationship dynamics
        required: true
    validation_rules:
      - rule_id: consent_boundary_explicitly_defined
        kind: interpretive_criterion
        condition: Clarity of a consent boundary depends on the accepted narrative context and presentation.
        error_message: Consent boundary may be ambiguous or undefined.
        applies_to: [netorare]
      - rule_id: consent_boundary_consistent
        kind: interpretive_criterion
        condition: Apparent boundary violations require interpretation against accepted facts and authorial intent.
        error_message: Consent boundary may be inconsistent with accepted narrative context.
        applies_to: [netorare]

  DesireManipulation:
    name: DesireManipulation
    definition: Psychological or emotional manipulation of character desires or their understanding of interactions and relationships.
    category: genre-specific
    parent_concepts:
      - Conflict
    relationships:
      - source_concept: DesireManipulation
        target_concept: Character
        cardinality: many-to-many
        description: Manipulation targets characters' understanding of their own desires
        required: true
      - source_concept: DesireManipulation
        target_concept: Revelation
        cardinality: one-to-many
        description: Manipulations may be revealed or recontextualized later in the narrative
        required: false
    validation_rules:
      - rule_id: desire_manipulation_has_origin
        kind: craft_heuristic
        condition: Manipulation commonly benefits from a legible narrative cause or origin.
        error_message: Desire manipulation may appear unmotivated.
        applies_to: [netorare]
      - rule_id: desire_manipulation_affects_choices
        kind: interpretive_criterion
        condition: Whether manipulation materially influences choices requires contextual judgment.
        error_message: Desire manipulation may have insufficient narrative consequence.
        applies_to: [netorare]

metadata:
  version: "2.0"
  last_updated: "2026-09-11"
  description: "Genre-specific semantic concepts for netorare narratives"
  genre: netorare
  extends: base
  new_concepts_count: 4
  new_concepts:
    - CuckoldryArc
    - HumiliationProgression
    - ConsentBoundary
    - DesireManipulation
