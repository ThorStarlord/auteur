# Base Narrative Ontology
# Historical 12-concept compatibility core. Modern supplemental vocabulary
# lives in semantic_vocabulary.yaml.

concepts:
  Character:
    name: Character
    definition: An entity capable of agency within the narrative. Characters have identities, beliefs, goals, and can participate in relationships and arcs.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Character
        target_concept: Goal
        relation_type: pursues
        cardinality: one-to-many
        description: Character pursues one or more goals
        required: false
      - source_concept: Character
        target_concept: Arc
        relation_type: participates_in
        cardinality: many-to-many
        description: Character can appear in multiple arcs
        required: false
      - source_concept: Character
        target_concept: Relationship
        relation_type: participates_in
        cardinality: one-to-many
        description: Character engages in relationships with other entities
        required: false
    validation_rules:
      - rule_id: character_must_have_identity
        kind: interpretive_criterion
        condition: Character must have a name or identifier
        error_message: Character cannot be defined without an identity
        applies_to: []
      - rule_id: character_may_have_goals
        kind: craft_heuristic
        condition: Character may have zero or more goals
        error_message: Character goal cardinality may be inconsistent
        applies_to: []
      - rule_id: character_may_appear_in_multiple_arcs
        kind: craft_heuristic
        condition: Same character can appear in multiple arcs
        error_message: Character should not be restricted to a single arc by ontology
        applies_to: []
      - rule_id: character_beliefs_must_be_consistent
        kind: interpretive_criterion
        condition: Character beliefs should form a coherent worldview unless contradiction is intentional
        error_message: Character beliefs may be contradictory within the same context
        applies_to: []

  Arc:
    name: Arc
    definition: A progression over time from a starting state to an ending state. Arcs can track character development, story progression, or thematic exploration.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Arc
        target_concept: Beat
        relation_type: participates_in
        cardinality: one-to-many
        description: Arc contains one or more beats
        required: true
      - source_concept: Arc
        target_concept: Character
        relation_type: participates_in
        cardinality: many-to-many
        description: Arc involves one or more characters
        required: false
      - source_concept: Arc
        target_concept: Theme
        relation_type: explores
        cardinality: many-to-many
        description: Arc explores one or more themes
        required: false
      - source_concept: Arc
        target_concept: Conflict
        relation_type: participates_in
        cardinality: one-to-many
        description: Arc contains one or more conflicts
        required: false
    validation_rules:
      - rule_id: arc_must_have_start
        kind: craft_heuristic
        condition: Arc should have an identifiable starting state
        error_message: Arc lacks a clear starting state
        applies_to: []
      - rule_id: arc_must_have_end
        kind: craft_heuristic
        condition: Arc should have an identifiable ending state or intentional open state
        error_message: Arc lacks a clear ending state
        applies_to: []
      - rule_id: arc_must_contain_beats
        kind: craft_heuristic
        condition: Arc should contain one or more structural beats
        error_message: Arc has no narrative moments
        applies_to: []
      - rule_id: arc_progression_is_monotonic
        kind: interpretive_criterion
        condition: Progression from start to end should exhibit meaningful change; it need not be monotonic
        error_message: Arc may show insufficient meaningful progression
        applies_to: []

  Theme:
    name: Theme
    definition: A recurring abstract idea or concept explored throughout the narrative. Themes are not concrete entities but intellectual or emotional explorations.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Theme
        target_concept: Arc
        relation_type: explores
        cardinality: many-to-many
        description: Theme is explored across arcs
        required: false
      - source_concept: Theme
        target_concept: Symbol
        relation_type: affects
        cardinality: many-to-many
        description: Theme may manifest through symbols
        required: false
    validation_rules:
      - rule_id: theme_is_abstract_concept
        kind: interpretive_criterion
        condition: Theme is an abstract semantic concern rather than a concrete story entity
        error_message: Theme may be modeled at the wrong semantic level
        applies_to: []
      - rule_id: theme_may_not_require_resolution
        kind: craft_heuristic
        condition: Theme may remain open or unresolved
        error_message: Theme need not resolve as a plot obligation
        applies_to: []
      - rule_id: theme_influences_multiple_arcs
        kind: craft_heuristic
        condition: A theme may influence multiple arcs
        error_message: Theme scope may be unnecessarily constrained
        applies_to: []

  Goal:
    name: Goal
    definition: A desired outcome that an entity, typically a character, wants to achieve. Goals create motivation and can generate conflicts.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Goal
        target_concept: Character
        relation_type: governed_by
        cardinality: many-to-many
        description: Goal is owned or pursued by a character
        required: true
      - source_concept: Goal
        target_concept: Conflict
        relation_type: affects
        cardinality: many-to-many
        description: Goal pursuit may create conflict
        required: false
    validation_rules:
      - rule_id: goal_must_be_desired_outcome
        kind: interpretive_criterion
        condition: Goal represents something an entity seeks
        error_message: Goal may not represent a desired outcome
        applies_to: []
      - rule_id: goal_may_be_achieved_or_abandoned
        kind: craft_heuristic
        condition: Goal can be pursued, achieved, transformed, or abandoned
        error_message: Goal lifecycle may be over-constrained
        applies_to: []
      - rule_id: goal_must_have_owner
        kind: interpretive_criterion
        condition: A story-instance goal should have an identifiable owner
        error_message: Goal has no identifiable owner
        applies_to: []

  Conflict:
    name: Conflict
    definition: Opposition or tension between forces, goals, values, constraints, or states within the narrative.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Conflict
        target_concept: Arc
        relation_type: participates_in
        cardinality: many-to-many
        description: Conflict may occur within an arc
        required: false
      - source_concept: Conflict
        target_concept: Payoff
        relation_type: affects
        cardinality: many-to-many
        description: Conflict may contribute to one or more payoffs or resolutions
        required: false
    validation_rules:
      - rule_id: conflict_must_involve_opposition
        kind: interpretive_criterion
        condition: Conflict should expose meaningful opposition or incompatible pressure
        error_message: Conflict may lack meaningful opposition
        applies_to: []
      - rule_id: conflict_creates_narrative_tension
        kind: interpretive_criterion
        condition: Conflict often creates tension or pressure, but effectiveness is a craft judgment
        error_message: Conflict may not generate effective tension
        applies_to: []
      - rule_id: conflict_must_have_stakes
        kind: interpretive_criterion
        condition: Conflict should make a consequence, value, or pressure legible
        error_message: Conflict may lack meaningful stakes
        applies_to: []

  Payoff:
    name: Payoff
    definition: The delivery, transformation, or resolution of material established earlier in the narrative. One payoff may answer multiple setups and one setup may support multiple payoffs.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Payoff
        target_concept: Setup
        relation_type: pays_off
        cardinality: many-to-many
        description: Payoff may resolve or transform one or more setups
        required: true
    validation_rules:
      - rule_id: payoff_resolves_setup
        kind: craft_heuristic
        condition: A payoff should be traceable to relevant setup material
        error_message: Payoff may lack supporting setup
        applies_to: []
      - rule_id: payoff_must_occur_after_setup
        kind: craft_heuristic
        condition: Payoff normally follows its setup in narrative order, while non-linear presentation may complicate surface order
        error_message: Payoff/setup ordering may need review
        applies_to: []

  Symbol:
    name: Symbol
    definition: An object, image, action, pattern, or motif that carries meaning beyond its literal function.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Symbol
        target_concept: Theme
        relation_type: explores
        cardinality: many-to-many
        description: Symbol may represent or develop themes
        required: false
    validation_rules:
      - rule_id: symbol_has_multiple_meanings
        kind: craft_heuristic
        condition: A symbol may support one or more meanings
        error_message: Symbol may be semantically thin
        applies_to: []
      - rule_id: symbol_meaning_evolves
        kind: interpretive_criterion
        condition: Symbol meaning may evolve through context; evolution is not universally required
        error_message: Symbol development may warrant review
        applies_to: []

  Relationship:
    name: Relationship
    definition: A connection between narrative entities, historically used primarily for character relationships. Prefer CharacterRelationship when that narrower domain is intended.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Relationship
        target_concept: Character
        relation_type: participates_in
        cardinality: many-to-many
        description: A character relationship connects participating characters
        required: true
    validation_rules:
      - rule_id: relationship_connects_entities
        kind: interpretive_criterion
        condition: A relationship assertion should identify the entities it connects
        error_message: Relationship has no clear participants
        applies_to: []
      - rule_id: relationship_affects_narrative
        kind: interpretive_criterion
        condition: Narrative relevance of a relationship is a craft judgment rather than an ontology invariant
        error_message: Relationship may be narratively inert
        applies_to: []

  Beat:
    name: Beat
    definition: A discrete, identifiable narrative moment. The compatibility term may describe planned or discussed moments; prefer StructuralBeat for structure plans.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Beat
        target_concept: Arc
        relation_type: participates_in
        cardinality: many-to-many
        description: Beat may belong to one or more arcs
        required: true
    validation_rules:
      - rule_id: beat_is_discrete_moment
        kind: interpretive_criterion
        condition: Beat should be identifiable as a narrative moment
        error_message: Beat boundary may be unclear
        applies_to: []
      - rule_id: beat_must_have_content
        kind: interpretive_criterion
        condition: A beat should carry some narrative function or content
        error_message: Beat may be empty of narrative function
        applies_to: []
      - rule_id: beat_belongs_in_arc
        kind: craft_heuristic
        condition: Beats often participate in arcs but may also serve local structure
        error_message: Beat may be structurally orphaned
        applies_to: []

  Setup:
    name: Setup
    definition: The establishment of material, promise, expectation, question, or condition available for later use, transformation, or resolution.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Setup
        target_concept: Payoff
        relation_type: sets_up
        cardinality: many-to-many
        description: A setup may support one or more payoffs, and a payoff may answer multiple setups
        required: true
    validation_rules:
      - rule_id: setup_introduces_element
        kind: interpretive_criterion
        condition: Setup establishes material whose later relevance can be assessed
        error_message: Setup may not establish identifiable material
        applies_to: []
      - rule_id: setup_must_be_resolved
        kind: craft_heuristic
        condition: Significant setup usually merits later use or intentional non-resolution; this is not a universal hard invariant
        error_message: Setup may be unresolved
        applies_to: []

  Revelation:
    name: Revelation
    definition: The disclosure of information previously unknown, concealed, misunderstood, or unavailable to an audience or character.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Revelation
        target_concept: Beat
        relation_type: participates_in
        cardinality: many-to-many
        description: Revelation may occur through one or more narrative moments
        required: false
    validation_rules:
      - rule_id: revelation_discloses_hidden_info
        kind: interpretive_criterion
        condition: Revelation should change what is known or understood
        error_message: Revelation may disclose nothing materially new
        applies_to: []
      - rule_id: revelation_changes_understanding
        kind: interpretive_criterion
        condition: Significance of a revelation is a narrative judgment
        error_message: Revelation may not materially change understanding
        applies_to: []

  Reversal:
    name: Reversal
    definition: A change that inverts or redirects an expected trajectory, outcome, advantage, interpretation, or pressure within an arc.
    category: base
    parent_concepts: []
    relationships:
      - source_concept: Reversal
        target_concept: Arc
        relation_type: affects
        cardinality: many-to-many
        description: Reversal may redirect an arc trajectory
        required: false
    validation_rules:
      - rule_id: reversal_inverts_trajectory
        kind: interpretive_criterion
        condition: Reversal should materially redirect an expected trajectory or interpretation
        error_message: Reversal may not materially redirect the narrative
        applies_to: []
      - rule_id: reversal_must_be_unexpected
        kind: interpretive_criterion
        condition: Degree of surprise is a reader/craft judgment, not a universal ontology invariant
        error_message: Reversal may be predictable
        applies_to: []

metadata:
  version: "2.0"
  last_updated: "2026-09-11"
  description: Historical compatibility core reconciled with Narrative Ontology V2 semantics
  concept_count: 12
