# Gentle Femdom Genre Ontology Extensions
# Genre-specific semantic concepts for gentle dominance/submission narratives.
# Craft/interpretive rules are advisory and never hard ontology validity.

extends: base

concepts:
  DominanceExpression:
    name: DominanceExpression
    definition: A character's manifestation of authority, control, or dominance through actions, words, or presence. Gentle expressions emphasize confidence and care rather than harshness.
    category: genre-specific
    parent_concepts:
      - Beat
    relationships:
      - source_concept: DominanceExpression
        target_concept: Character
        cardinality: many-to-many
        description: Character expresses dominance through this beat
        required: true
      - source_concept: DominanceExpression
        target_concept: Relationship
        cardinality: many-to-many
        description: Expression affects relationship dynamics
        required: true
    validation_rules:
      - rule_id: dominance_expression_is_consensual
        kind: interpretive_criterion
        condition: Whether an expression respects established consent boundaries requires story-context judgment.
        error_message: Dominance expression may conflict with established consent.
        applies_to: [gentlefemdom]
      - rule_id: dominance_expression_shows_care
        kind: craft_heuristic
        condition: Gentle-dominance presentation commonly signals care alongside authority.
        error_message: Dominance expression may lack the intended caring register.
        applies_to: [gentlefemdom]

  SubmissionResponse:
    name: SubmissionResponse
    definition: A character's acceptance, acquiescence, or yielding to another character's authority or request. Submission responses vary in degree and emotional tone.
    category: genre-specific
    parent_concepts:
      - Beat
    relationships:
      - source_concept: SubmissionResponse
        target_concept: Character
        cardinality: many-to-many
        description: Character responds with submission through this beat
        required: true
      - source_concept: SubmissionResponse
        target_concept: DominanceExpression
        cardinality: many-to-one
        description: Response is often directed toward a dominance expression
        required: false
    validation_rules:
      - rule_id: submission_response_is_voluntary
        kind: interpretive_criterion
        condition: Voluntariness depends on accepted context, boundaries, and character state.
        error_message: Submission may read as coerced rather than chosen.
        applies_to: [gentlefemdom]
      - rule_id: submission_response_shows_emotion
        kind: craft_heuristic
        condition: Submission response commonly benefits from legible emotional experience.
        error_message: Submission response may lack emotional specificity.
        applies_to: [gentlefemdom]

  PowerDynamicArc:
    name: PowerDynamicArc
    definition: A narrative arc centered on the development, evolution, or resolution of power relationships between characters, particularly between dominant and submissive partners.
    category: genre-specific
    parent_concepts:
      - Arc
    relationships:
      - source_concept: PowerDynamicArc
        target_concept: Character
        cardinality: many-to-many
        description: Characters engage in the power dynamic
        required: true
      - source_concept: PowerDynamicArc
        target_concept: Relationship
        cardinality: many-to-many
        description: Power dynamic shapes relationship evolution
        required: true
      - source_concept: PowerDynamicArc
        target_concept: DominanceExpression
        cardinality: one-to-many
        description: Arc includes expressions of dominance
        required: false
    validation_rules:
      - rule_id: power_dynamic_arc_shows_evolution
        kind: craft_heuristic
        condition: A power-dynamic arc normally changes, deepens, or deliberately stabilizes over time.
        error_message: Power dynamic may remain unintentionally static.
        applies_to: [gentlefemdom]
      - rule_id: power_dynamic_arc_respects_boundaries
        kind: interpretive_criterion
        condition: Boundary consistency requires interpretation against accepted character and relationship context.
        error_message: Power dynamic evolution may conflict with established boundaries.
        applies_to: [gentlefemdom]

  IntimacyProgression:
    name: IntimacyProgression
    definition: The gradual deepening of emotional and/or physical intimacy between characters. Intimacy progression tracks vulnerability, trust-building, and connection growth.
    category: genre-specific
    parent_concepts:
      - Arc
    relationships:
      - source_concept: IntimacyProgression
        target_concept: Character
        cardinality: many-to-many
        description: Characters experience intimacy progression
        required: true
      - source_concept: IntimacyProgression
        target_concept: Relationship
        cardinality: many-to-many
        description: Intimacy progression drives relationship development
        required: true
    validation_rules:
      - rule_id: intimacy_progression_is_gradual
        kind: craft_heuristic
        condition: Intimacy progression commonly benefits from legible narrative development, though deliberate sudden change remains possible.
        error_message: Intimacy may appear insufficiently developed for the intended effect.
        applies_to: [gentlefemdom]
      - rule_id: intimacy_progression_shows_vulnerability
        kind: craft_heuristic
        condition: Vulnerability is a common but not universal craft signal of deepening intimacy.
        error_message: Intimacy progression may lack emotional depth for the intended mode.
        applies_to: [gentlefemdom]

metadata:
  version: "2.0"
  last_updated: "2026-09-11"
  description: "Genre-specific semantic concepts for gentle femdom narratives"
  genre: gentlefemdom
  extends: base
  new_concepts_count: 4
  new_concepts:
    - DominanceExpression
    - SubmissionResponse
    - PowerDynamicArc
    - IntimacyProgression
