# Mystery Genre Ontology Extensions
# Genre-specific semantic concepts for mystery narratives.
# Craft/interpretive rules are advisory and never hard ontology validity.

extends: base

concepts:
  MysteryProblem:
    name: MysteryProblem
    definition: A central puzzle or unknown that drives the narrative forward. The mystery problem is what the protagonist must solve, discover, or understand.
    category: genre-specific
    parent_concepts:
      - Setup
    relationships:
      - source_concept: MysteryProblem
        target_concept: Revelation
        cardinality: many-to-one
        description: Mystery problem is solved through revelations
        required: true
      - source_concept: MysteryProblem
        target_concept: Character
        cardinality: many-to-many
        description: Characters investigate or are affected by the mystery problem
        required: true
    validation_rules:
      - rule_id: mystery_problem_is_solvable
        kind: craft_heuristic
        condition: Mystery problem should have a solution or intentionally qualified unresolved status.
        error_message: Mystery problem may be unsolvable or incoherent.
        applies_to: [mystery]
      - rule_id: mystery_problem_affects_protagonist
        kind: craft_heuristic
        condition: Mystery problem should materially connect to protagonist concerns.
        error_message: Mystery problem may be disconnected from protagonist concerns.
        applies_to: [mystery]

  Clue:
    name: Clue
    definition: A piece of information, object, or observation that provides evidence toward solving the mystery. Clues can be misleading or definitively point toward the solution.
    category: genre-specific
    parent_concepts:
      - Beat
    relationships:
      - source_concept: Clue
        target_concept: MysteryProblem
        cardinality: many-to-one
        description: Clue provides evidence about the mystery problem
        required: true
      - source_concept: Clue
        target_concept: Character
        cardinality: many-to-many
        description: Character discovers or receives the clue
        required: true
    validation_rules:
      - rule_id: clue_relates_to_mystery
        kind: interpretive_criterion
        condition: A clue should meaningfully relate to the mystery under the intended reading.
        error_message: Clue may be unrelated to the central mystery.
        applies_to: [mystery]
      - rule_id: clue_is_discoverable
        kind: craft_heuristic
        condition: Fair-play mystery design normally makes relevant clue evidence available through the narrative.
        error_message: Clue may be inaccessible to the intended investigator or audience.
        applies_to: [mystery]

  RedHerring:
    name: RedHerring
    definition: A misleading clue, false lead, or misdirection that initially appears to point toward a solution but does not. Red herrings complicate investigation and can deceive readers.
    category: genre-specific
    parent_concepts:
      - Setup
    relationships:
      - source_concept: RedHerring
        target_concept: Clue
        cardinality: one-to-one
        description: Red herring appears to be a clue but is misleading
        required: false
      - source_concept: RedHerring
        target_concept: Revelation
        cardinality: one-to-one
        description: Red herring may be exposed or recontextualized by revelation
        required: false
    validation_rules:
      - rule_id: red_herring_is_initially_convincing
        kind: interpretive_criterion
        condition: Plausibility of a red herring is an audience-facing craft judgment.
        error_message: Red herring may be obviously false from the start.
        applies_to: [mystery]
      - rule_id: red_herring_is_revealed
        kind: craft_heuristic
        condition: A red herring normally receives later exposure or recontextualization.
        error_message: Red herring may remain unintentionally unresolved.
        applies_to: [mystery]

  InvestigativeArc:
    name: InvestigativeArc
    definition: A narrative arc centered on the protagonist's investigation, discovery process, and gradual accumulation of understanding about the mystery problem.
    category: genre-specific
    parent_concepts:
      - Arc
    relationships:
      - source_concept: InvestigativeArc
        target_concept: Clue
        cardinality: one-to-many
        description: Investigative arc includes discovery of clues
        required: true
      - source_concept: InvestigativeArc
        target_concept: MysteryProblem
        cardinality: many-to-one
        description: Investigation targets the central mystery
        required: true
      - source_concept: InvestigativeArc
        target_concept: Character
        cardinality: many-to-many
        description: Characters engage in investigation
        required: true
    validation_rules:
      - rule_id: investigative_arc_shows_progress
        kind: craft_heuristic
        condition: An investigative arc normally develops or changes understanding over time.
        error_message: Investigation may show insufficient progress.
        applies_to: [mystery]
      - rule_id: investigative_arc_reaches_resolution
        kind: craft_heuristic
        condition: An investigative arc normally reaches a solution, major revelation, or intentional unresolved state.
        error_message: Investigation may end without an intentional resolution state.
        applies_to: [mystery]

