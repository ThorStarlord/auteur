[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auteur"
version = "1.0.0"
description = "Agentic narrative engineering: a literary compiler for long-form fiction."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "markdown-it-py>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pytest-xdist>=3.0,<4", "ruff>=0.4.0,<1"]
anthropic = ["anthropic>=0.39,<1"]
openai = ["openai>=1.40,<2"]
all = ["anthropic>=0.39,<1", "openai>=1.40,<2", "pytest-xdist>=3.0,<4"]

[project.scripts]
auteur = "auteur.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auteur"]

[tool.hatch.build.targets.sdist]
include = ["src/auteur/**"]

[tool.pytest.ini_options]
addopts = "-q --tb=short -W ignore::UserWarning"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
include = ["src/auteur/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/auteur"]
omit = ["src/auteur/**/test_*", "src/auteur/**/browser/*"]
